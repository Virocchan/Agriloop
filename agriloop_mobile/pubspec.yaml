name: agriloop_mobile
description: "AgriLoop — Smart Community Composting & Waste Diversion Ecosystem for Sime Darby Communities"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  
  # Backend & Realtime
  supabase: ^2.16.5
  
  # Camera, Scanning & QR Generation
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Local Persistence (demo state survives reloads)
  shared_preferences: ^2.5.6

  # Outbound HTTP for the optional n8n / Telegram pipeline
  http: ^1.6.0
  
  # UI & Charts & Design Tokens
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
